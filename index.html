<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pokémon Destiny</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 3px solid #333;
            background-color: #87ceeb;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }

        #dialogBox {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 15px;
            border: 3px solid #ffed4e;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
            max-width: calc(100% - 40px);
            line-height: 1.5;
            word-wrap: break-word;
        }

        #dialogBox.hidden {
            display: none;
        }

        .dpad {
            position: fixed;
            bottom: 100px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 50;
        }

        .dpad-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .dpad-btn {
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 5px;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        .dpad-btn:active {
            background-color: rgba(255, 255, 255, 0.6);
        }

        #actionBtn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background-color: #ffed4e;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 50;
        }

        #actionBtn:active {
            background-color: #ffd700;
        }

        .battle-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(100,50,200,0.9) 0%, rgba(20,10,60,0.95) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            flex-direction: column;
            gap: 30px;
        }

        .battle-screen.hidden {
            display: none;
        }

        .battle-info {
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .battle-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border: 3px solid #a0a0ff;
            border-radius: 10px;
        }

        .battle-btn {
            padding: 20px;
            background: linear-gradient(135deg, #4a148c 0%, #7c3aed 100%);
            color: white;
            border: 2px solid #a0a0ff;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            min-width: 150px;
            text-align: center;
        }

        .battle-btn:active {
            background: linear-gradient(135deg, #5e1ba8 0%, #8b5cf6 100%);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="dialogBox" class="hidden"></div>
        
        <div class="dpad">
            <div class="dpad-row">
                <div class="dpad-btn" id="upBtn">⬆️</div>
            </div>
            <div class="dpad-row">
                <div class="dpad-btn" id="leftBtn">⬅️</div>
                <div class="dpad-btn" id="downBtn">⬇️</div>
                <div class="dpad-btn" id="rightBtn">➡️</div>
            </div>
        </div>
        
        <button id="actionBtn">SPACE</button>

        <div id="battleScreen" class="battle-screen hidden">
            <div class="battle-info">
                <p id="battleText">Wild Mega Raichu Y appeared!</p>
            </div>
            <div class="battle-options">
                <button class="battle-btn" id="attackBtn">⚡ Attack</button>
                <button class="battle-btn" id="megaBtn">🔥 Mega Evolve</button>
                <button class="battle-btn" id="itemBtn">📦 Item</button>
                <button class="battle-btn" id="runBtn">🏃 Run</button>
            </div>
        </div>
    </div>

    <script src="sprites.js"></script>
    <script src="game.js"></script>
</body>
</html>
